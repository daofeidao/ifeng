name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Build macOS universal app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swiftc --version
          clang --version
          sw_vers

      - name: Build (universal binary)
        run: UNIVERSAL=1 bash build.sh

      - name: Verify artifact
        run: |
          set -e
          App="build/风扇控制.app"
          test -d "$App"
          lipo -info "$App/Contents/MacOS/iFeng"
          test -x "$App/Contents/Resources/fanctl"
          lipo -info "$App/Contents/Resources/fanctl"
          codesign --verify --deep --strict "$App"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifeng-mac
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "风扇控制 ${GITHUB_REF_NAME}" \
            --notes "iFeng ${GITHUB_REF_NAME} · 通用二进制（Intel / Apple Silicon），解压后拖入「应用程序」即可。" \
          || gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
